# ==============================================================================
# Centralized Project Configuration
# Real-Time Two-Stage Vehicle Detection and Classification Pipeline
# ==============================================================================

project:
  name: "vehicle-type-classification"
  version: "1.0.0"
  description: "Real-time two-stage vehicle detection (YOLOv8) and fine-grained classification (MobileNetV2)"

# Relative to project root; resolved dynamically at runtime via path helpers
paths:
  artifacts_dir: "artifacts"
  models_dir: "models"
  data_dir: "data"
  outputs_dir: "outputs"
  class_indices_path: "artifacts/class_indices.json"

# Dataset and image preprocessing parameters
data:
  dataset_dir: "data/classification-dataset"
  image_height: 224
  image_width: 224
  image_channels: 3
  batch_size: 32
  validation_split: 0.2

# Stage 1: Object Detection (Ultralytics YOLOv8)
detector:
  model_path: "yolov8n.pt"
  confidence_threshold: 0.4
  # COCO class IDs mapped to vehicle label names
  vehicle_classes:
    2: "car"
    3: "motorcycle"
    5: "bus"
    7: "truck"

# Stage 2: Fine-Grained Classification (MobileNetV2)
classifier:
  model_path: "models/vehicle_classifier_best.keras"
  input_height: 224
  input_width: 224
  num_classes: 5
  class_names:
    - "Bus"
    - "Car"
    - "Three Wheeler"
    - "Truck"
    - "motorcycle"

# Training and Transfer Learning Hyperparameters (Preserved from Notebook 03)
training:
  stage1:
    epochs: 10
    learning_rate: 0.0001 # 1e-4
    early_stopping_patience: 5
  stage2:
    epochs: 20
    learning_rate: 0.00001 # 1e-5
    unfreeze_last_n_layers: 30
    early_stopping_patience: 5
    reduce_lr_patience: 3
    reduce_lr_factor: 0.3
    reduce_lr_min: 0.000001 # 1e-6
  augmentations:
    rotation_range: 20
    width_shift_range: 0.15
    height_shift_range: 0.15
    shear_range: 0.15
    zoom_range: 0.15
    horizontal_flip: true
    gaussian_noise_std: 0.02
    cutout_mask_size: 50

# Live & Video Inference Settings (Preserved from live_camera.py & test-video)
inference:
  camera_index: 1 # Fallback to 0 if 1 is unavailable
  frame_width: 1920
  frame_height: 1080
  window_name: "Real-Time Vehicle Classification"
  fullscreen: true

# Logging Configuration
logging:
  level: "INFO"
  log_to_file: true
  log_file: "outputs/logs/app.log"

